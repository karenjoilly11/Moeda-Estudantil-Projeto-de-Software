server.port=8082

spring.application.name=email-service

# =====================================================
# RABBITMQ
# =====================================================

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# =====================================================
# MAIL
# =====================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.from=${MAIL_FROM:noreply@moedaestudantil.local}

# =====================================================
# ACTUATOR (healthcheck)
# =====================================================
# Expõe /actuator/health pro Docker HEALTHCHECK. Mantém o resto fechado.
management.endpoints.web.exposure.include=health
# UP mesmo se o SMTP (mail) estiver desabilitado/inacessível — o microsserviço
# só consome do Rabbit, e o Rabbit já é dependência via depends_on healthy.
management.health.mail.enabled=false
management.endpoint.health.show-details=never