# Profile prod — ativado via SPRING_PROFILES_ACTIVE=prod (Render).
#
# Banco (SPRING_DATASOURCE_*), RabbitMQ (SPRING_RABBITMQ_*) e PORT são fornecidos
# via env vars no painel do Render, lidos automaticamente pelo Spring Boot.
# Por isso NÃO são declarados aqui — evita conflito/duplicidade.
#
# Único item específico do app (não-Spring) é o CORS, abaixo. Já existe env var
# CORS_ALLOWED_ORIGINS no Render; o default serve só de fallback.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://moeda-frontend.onrender.com}
