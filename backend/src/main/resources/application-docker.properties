# Profile docker — ativado via SPRING_PROFILES_ACTIVE=docker (containerizado)
# Usa H2 em memória: sobe sem banco externo. ATENÇÃO: dados são voláteis,
# somem a cada restart/deploy. Adequado para demo/apresentação, não produção.

spring.datasource.url=jdbc:h2:mem:moeda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Console H2 desabilitado em prod
spring.h2.console.enabled=false

# CORS: liberar o frontend do Render. Sobrescreva via env CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://moeda-frontend.onrender.com}

# RabbitMQ (CloudAMQP). Defaults evitam que o boot quebre quando não configurado.
# Broker offline não derruba a app: EmailProducerService captura AmqpException.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Não fica tentando reconectar eternamente no startup
spring.rabbitmq.connection-timeout=5000